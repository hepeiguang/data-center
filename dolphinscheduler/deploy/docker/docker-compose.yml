#version: "3.8"

services:
  postgresql:
    image: postgresql:15.2.0
    ports:
      - "5432:5432"
    profiles: ["all", "schema"]
    environment:
      POSTGRESQL_USERNAME: root
      POSTGRESQL_PASSWORD: root
      POSTGRESQL_DATABASE: dam
    volumes:
      - ds-postgresql:/opt/postgresql
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/5432"]
      interval: 5s
      timeout: 60s
      retries: 120
    networks:
      - zdkj-net

  zookeeper:
    image: zookeeper:3.8.1
    ports:
      - "2181:2181"
    profiles: ["all"]
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
      ZOO_4LW_COMMANDS_WHITELIST: srvr,ruok,wchs,cons
    volumes:
      - ${SERVICE_HOME}/zookeeper:/opt/zookeeper
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/2181"]
      interval: 5s
      timeout: 60s
      retries: 120
    networks:
      - zdkj-net

  ds-schema-initializer:
    image: dolphinscheduler-tools:${TAG}
    env_file: .env
    profiles: ["schema"]
    command: [ tools/bin/upgrade-schema.sh ]
#    depends_on:
#      ds-postgresql:
#        condition: service_healthy
    volumes:
      - ds-logs:/opt/dolphinscheduler/logs
      - ${DEPENDS_SOFT_HOME}:/opt/soft
      - ds-resource-local:/dolphinscheduler
    networks:
      - zdkj-net

  api-server:
    mem_limit: 2g
    cpus: 2
    image: zdkj/api-server:${TAG}
    ports:
      - "12345:12345"
      - "25333:25333"
    profiles: ["all"]
    env_file: .env
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:12345/dolphinscheduler/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
#    depends_on:
#      zookeeper:
#        condition: service_healthy
    volumes:
      - ${SERVICE_HOME}/dolphinscheduler/api-server:/opt/dolphinscheduler/api-server
      - ${DEPENDS_SOFT_HOME}:/opt/soft
    networks:
      - zdkj-net

  alert-server:
    image: zdkj/alert-server:${TAG}
    profiles: ["all"]
    env_file: .env
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:50053/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
#    depends_on:
#      zookeeper:
#        condition: service_healthy
    volumes:
      - ${SERVICE_HOME}/dolphinscheduler/alert-server:/opt/dolphinscheduler/alert-server
    networks:
      - zdkj-net

  master-server:
    mem_limit: 4g
    cpus: 2
    image: zdkj/master-server:${TAG}
    profiles: ["all"]
    env_file: .env
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:5679/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
#    depends_on:
#      zookeeper:
#        condition: service_healthy
    volumes:
      - ${SERVICE_HOME}/dolphinscheduler/master-server:/opt/dolphinscheduler/master-server
      - ${DEPENDS_SOFT_HOME}:/opt/soft
    networks:
      - zdkj-net

  worker-server:
    mem_limit: 4g
    cpus: 2
    image: zdkj/worker-server:${TAG}
    profiles: ["all"]
    env_file: .env
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:1235/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
#    depends_on:
#      zookeeper:
#        condition: service_healthy
    volumes:
      - /tmp/dolphinscheduler:/tmp/dolphinscheduler
      - ${SERVICE_HOME}/dolphinscheduler/worker-server:/opt/dolphinscheduler/worker-server
      - ${DEPENDS_SOFT_HOME}:/opt/soft
      - /dolphinscheduler:/dolphinscheduler
    networks:
      - zdkj-net

networks:
  zdkj-net:
    driver: bridge

