# data-api front gateway (nginx 1.20+)
# Install: cp data-api.conf /etc/nginx/conf.d/data-api.conf && nginx -t && nginx -s reload

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65s;

    log_format da '$remote_addr - $http_x_app_id [$time_local] "$request" $status '
                  '$body_bytes_sent rt=$request_time uct=$upstream_connect_time '
                  'uht=$upstream_header_time urt=$upstream_response_time trace=$http_x_trace_id';
    access_log /var/log/nginx/data-api.access.log da;
    error_log  /var/log/nginx/data-api.error.log warn;

    # Coarse protection in front of the per-subject limiter inside data-api.
    limit_req_zone $binary_remote_addr zone=da_ip:20m rate=100r/s;
    map $http_token $da_token_key {
        ""      $binary_remote_addr;
        default $http_token;
    }
    limit_req_zone $da_token_key zone=da_token:20m rate=50r/s;
    limit_req_status 429;

    # Replace with the real portal origin(s). Keep empty to disable CORS at nginx.
    map $http_origin $cors_origin {
        default "";
        "~^https://data\.example\.com$" $http_origin;
        "~^http://localhost:3000$"      $http_origin;
    }

    upstream data_api {
        # cluster profile: both instances read/write magic_api_file in the shared metadata DB
        server 127.0.0.1:12346 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:12347 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 8088;
        server_name data-api.internal;

        # TLS template:
        # listen 8443 ssl http2;
        # ssl_certificate     /etc/nginx/certs/data-api.crt;
        # ssl_certificate_key /etc/nginx/certs/data-api.key;
        # ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 2m;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    70s;
        proxy_read_timeout    70s;

        add_header Access-Control-Allow-Origin  $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "token, sessionId, Authorization, X-App-Id, X-App-Secret, Content-Type, X-Trace-Id" always;
        add_header Access-Control-Expose-Headers "X-Trace-Id" always;
        add_header Vary Origin always;
        if ($request_method = OPTIONS) {
            return 204;
        }

        # liveness: no auth, no audit noise
        location = /data-api/health {
            proxy_pass http://data_api;
            access_log off;
        }

        # OpenAPI document (kept behind token by default; open-api-public=true if needed)
        location = /data-api/openapi.json {
            limit_req zone=da_ip burst=20 nodelay;
            proxy_pass http://data_api;
        }

        # business gateway + admin APIs
        location /data-api/ {
            limit_req zone=da_ip    burst=200 nodelay;
            limit_req zone=da_token burst=100 nodelay;
            proxy_pass http://data_api;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # magic console: internal only, never expose to the Internet
        location /magic/ {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny  all;
            proxy_pass http://data_api;
            proxy_read_timeout 300s;
        }

        location = / {
            return 302 /data-api/health;
        }
    }
}
