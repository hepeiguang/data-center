######
###### UDP receive → JS structure → Filter trim → LocalFile
###### Run (Windows example):
######   set SEATUNNEL_HOME=D:\HPG\workspace\LHYF\apache-seatunnel-3.0.0
######   set HADOOP_HOME=D:\HPG\workspace\LHYF\tools\hadoop-3.1.1
######   %SEATUNNEL_HOME%\bin\seatunnel.cmd -m local --config %SEATUNNEL_HOME%\config\jobs\udp-filter-localfile.conf
######
env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 3000
}

source {
  UDP {
    plugin_output = "udp_raw"
    host = "127.0.0.1"
    port = 19881
    bufferSize = 4096
    transport = "netty"
    parseMode = "js"
    # UI upload / orchestration: udfName resolves to $SEATUNNEL_HOME/udf/udp-codec/<name>.js
    # scriptPath = absolute path (works with current jars)
    scriptPath = "${SEATUNNEL_HOME}/udf/udp-codec/telemetry_struct.js"
    # udfName = "telemetry_struct"
    parseErrorHandleWay = "skip"
    schema = {
      fields {
        msgType = "int"
        flags = "int"
        value = "int"
        tag = "string"
        remoteHost = "string"
        remotePort = "int"
        pktLen = "int"
        ts = "long"
      }
    }
  }
}

transform {
  Filter {
    plugin_input = "udp_raw"
    plugin_output = "udp_trimmed"
    include_fields = [msgType, value, tag, ts]
  }
}

sink {
  LocalFile {
    plugin_input = "udp_trimmed"
    path = "D:/HPG/workspace/LHYF/data/udp-pipeline-out"
    tmp_path = "D:/HPG/workspace/LHYF/data/udp-pipeline-tmp"
    file_format_type = "json"
    custom_filename = true
    file_name_expression = "${transactionId}_udp_${now}"
    filename_time_format = "yyyyMMddHHmmss"
    encoding = "UTF-8"
    is_enable_transaction = true
    batch_size = 10
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    data_save_mode = "APPEND_DATA"
  }
}
