daemon off;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;
    access_log /dev/stdout;
    client_max_body_size 1024m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8088;
        server_name _;

        location = / {
            return 302 /dolphinscheduler/ui/;
        }

        # DolphinScheduler API + bundled UI
        location /dolphinscheduler/ {
            proxy_pass http://127.0.0.1:12345;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # data-api gateway, health, OpenAPI, admin APIs
        location /data-api/ {
            proxy_pass http://127.0.0.1:12346;
        }

        # magic console (keep internal in production; exposed here for the single container demo)
        location /magic/ {
            proxy_pass http://127.0.0.1:12346;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
